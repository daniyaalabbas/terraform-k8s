name: Terraform Infrastructure

on:
  push:
    paths:
      - 'main.tf'
      - 'provider.tf'
      - 'variables.tf'
      - 'terraform.tfvars'

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
