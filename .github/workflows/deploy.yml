name: Build and Deploy Application

on:
  push:
    paths:
      - 'Dockerfile'
      - 'app.py'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t daniyaalabbas/my-k8s-web:${{ github.sha }} \
            -t daniyaalabbas/my-k8s-web:latest .

      - name: Push Docker Images
        run: |
          docker push daniyaalabbas/my-k8s-web:${{ github.sha }}
          docker push daniyaalabbas/my-k8s-web:latest

      - name: Deploy New Image
        run: |
          kubectl set image deployment/my-k8s-web \
          my-k8s-web=daniyaalabbas/my-k8s-web:${{ github.sha }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/my-k8s-web --timeout=180s

      - name: Verify
        run: |
          kubectl get pods
          kubectl get deployment
          kubectl get svc

      - name: Smoke Test
        run: |
          sleep 10
          curl -I http://$(minikube ip):31749
